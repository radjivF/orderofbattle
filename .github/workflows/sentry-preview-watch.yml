name: Sentry preview watch

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: sentry-preview-watch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Fetch preview Sentry issues
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: zheat
          SENTRY_PROJECT: orderofbattle
          SENTRY_REGION: us
        run: yarn sentry:prod-watch --env preview --json watch.json --md watch.md
      - name: Comment on PR and fail if preview still has errors
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/sentry-preview-watch-github.sh
